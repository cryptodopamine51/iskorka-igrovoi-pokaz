.home-stage { container-type:inline-size; width:100%; color:#fff; font-family:Balsamiq,'Trebuchet MS',sans-serif; line-height:1.18; }
.home-stage *, .home-stage *::before, .home-stage *::after { box-sizing:border-box; }
.home-stage button { appearance:none; border:0; margin:0; background:none; padding:0; font:inherit; color:inherit; cursor:pointer; text-align:inherit; }
.home-stage button:focus-visible { outline:3px solid #fff49d; outline-offset:4px; border-radius:5px; }
.home-stage button:active { transform:translateY(1px); }
.home-stage h2, .home-stage h3, .home-stage p, .home-stage ul, .home-stage li { margin:0; padding:0; }
.home-stage ul { list-style:none; }
.home-world { position:relative; isolation:isolate; width:100%; aspect-ratio:1.96; min-height:500px; overflow:hidden; background:#102342; }
.home-art, .home-shade { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.home-art { z-index:-3; display:block; object-fit:cover; }
.home-shade { z-index:-2; }
.home-stage .home-title { position:absolute; font-weight:700; font-size:clamp(41px,5.65cqw,112px); line-height:.91; letter-spacing:-.055em; }
.home-title-line { display:block; }
.home-stage .home-status { position:absolute; top:5.5%; right:4.6%; display:flex; align-items:center; gap:.75em; font-size:clamp(14px,1.34cqw,26px); line-height:1; font-weight:700; }
.home-day { display:flex; align-items:center; gap:.72em; }
.home-day::after { content:'✦'; font-size:.66em; }
.home-stage .home-gear, .home-stage .home-rules, .home-stage .home-episode { position:absolute; }
.home-stage .home-section-title { font-size:clamp(15px,1.38cqw,29px); line-height:1.15; letter-spacing:.012em; font-weight:700; }
.home-stage .home-rule-list { display:grid; margin-top:.65cqw; }
.home-stage .home-rule { display:flex; align-items:center; gap:.68em; min-height:max(30px,2.72cqw); font-size:clamp(16px,1.64cqw,33px); line-height:1.08; transition:color .15s ease; }
.home-rule-name { display:block; }
.home-rule:hover .home-rule-name { text-decoration:underline; text-underline-offset:.18em; }
.home-stage .home-count { margin-left:.9em; font-weight:400; font-size:.84em; white-space:nowrap; }
.home-stage .home-gear-list { display:flex; align-items:flex-end; gap:.48cqw; }
.home-gear-list li { flex:1 1 0; min-width:0; }
.home-stage .home-gear-button { width:100%; display:flex; flex-direction:column; align-items:center; text-align:center; padding:.25cqw 0; }
.home-gear-holder { position:relative; display:grid; grid-template: minmax(0,1fr) / minmax(0,1fr); place-items:center; width:100%; height:4.6cqw; min-height:42px; max-height:112px; }
.home-stage .home-gear-art { max-width:83%; height:90%; display:block; object-fit:contain; transition:transform .16s ease; }
.home-gear-button:hover .home-gear-art { transform:translateY(-3px) rotate(-5deg); }
.home-item-status { position:absolute; bottom:2%; right:9%; border-radius:50%; display:grid; place-items:center; width:1.22em; height:1.22em; line-height:1; font-weight:bold; font-size:clamp(10px,.84cqw,16px); }
.home-item-name { display:block; margin-top:.43em; font-size:clamp(12px,1.16cqw,23px); line-height:1.13; }
.home-episode { display:flex; flex-direction:column; align-items:center; }
.home-stage .home-place { font-size:clamp(17px,1.68cqw,34px); font-weight:700; margin-bottom:.42em; text-align:center; }
.home-stage .home-play { position:relative; display:inline-flex; gap:.55em; align-items:center; min-height:44px; padding:.54em .98em .57em .82em; border-radius:2em; font-size:clamp(17px,1.55cqw,31px); line-height:1; font-weight:700; white-space:nowrap; transition:filter .15s ease,transform .15s ease; }
.home-stage .home-play:hover { filter:brightness(1.1); transform:translateY(-2px); }
.home-play-mark { font-family:Arial,sans-serif; font-size:.72em; line-height:1; }

/* The first game's glade and Iskorka, with room for the five rules and all six finds. */
.home-glade {color:#234c42}
.home-glade .home-world {background:#deedf3}
.home-glade .home-art {object-position:center}
.home-glade .home-shade {
  background:linear-gradient(0deg,#eef7f8 0%,#eef7f8b7 16%,transparent 38%),
             linear-gradient(90deg,transparent 43%,#eef7f825 58%,#eff8f597 100%);
}
.home-glade .home-title {
  top:12%;left:52%;width:44%;font-size:clamp(39px,5.4cqw,105px);
  text-shadow:0 2px 0 #fafffa,0 0 18px #fff;
}
.home-glade .home-status {
  top:4%;right:4.2%;padding:.65em .95em;border:1px solid #aac4bc;border-radius:2em;
  color:#244d44;background:#f8f9eb;
}
.home-fox {
  position:absolute;z-index:-1;top:12%;left:7%;width:43%;height:70%;
  object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 9px 5px #79889580);
  pointer-events:none;
}

.qp-stage {
  --qp-deep: #141f33;
  --qp-ink: #172c3e;
  --qp-paper: #fff5d8;
  --qp-muted: #cbd7e0;
  --qp-tint: #ffce73;
  --qp-warm: #ffdc95;
  --qp-rim: #475870;
  background: radial-gradient(ellipse at 94% 0%, #344256 0, transparent 48%), var(--qp-deep);
  color: #fff9e9;
  width: 100%;
  min-width: 0;
  padding: clamp(15px, 2.5vw, 38px) clamp(16px, 3.6vw, 60px) clamp(26px, 3.6vw, 60px);
  box-sizing: border-box;
  font-family: inherit;
  text-align: left;
  container-type: inline-size;
  isolation: isolate;
}
.qp-stage *, .qp-stage *::before, .qp-stage *::after {box-sizing: border-box;}
.qp-stage.qp-fork {--qp-tint: #aee2d2; --qp-warm: #bedfcc;}
.qp-stage.qp-direct {--qp-tint: #ffb3a5; --qp-warm: #ffbeb0;}
.qp-stage :is(h2,h3,h4,p,figure) {margin: 0;}
.qp-stage button, .qp-stage summary {font: inherit; cursor: pointer;}
.qp-stage svg {width: 1.1em; height: 1.1em; flex: 0 0 auto;}
.qp-stage button:focus-visible, .qp-stage summary:focus-visible {outline: 3px solid #fff8c8; outline-offset: 4px;}
.qp-stage button:disabled {cursor: default;}
.qp-top, .qp-main {width: min(100%, 1536px); margin-inline: auto;}
.qp-top {
  display: flex; justify-content: space-between; align-items: center;
  padding-bottom: clamp(14px, 1.8vw, 26px); gap: 12px;
}
.qp-format-tag {display: inline-flex; align-items: center; gap: 10px; font-size: clamp(17px, 1.3vw, 23px); font-weight: 700; color: var(--qp-tint);}
.qp-format-tag svg {width: 29px; height: 29px; filter: drop-shadow(0 1px 6px #fbdfa526);}
.qp-main {display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); align-items: start; gap: clamp(22px, 3.7vw, 64px);}
.qp-image {position: sticky; top: 14px; width: 100%; min-width: 0;}
.qp-scene-art {
  width: 100%; height: auto; max-height: 62vh; display: block; object-fit: contain;
  background: #1d2a3c; border-radius: 14px; box-shadow: 0 5px 20px #0913275c;
}
.qp-caption {display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px 2px 4px; color: #fffae7;}
.qp-waypoint {display: inline-flex; align-items: center; gap: 6px; font-size: clamp(15px, 1.3vw, 21px); color: #ffe4a1;}
.qp-waypoint svg {width: 17px; height: 17px;}
.qp-stage .qp-place {font-size: clamp(29px, 3.1vw, 49px); line-height: 1.04; font-weight: 700; color: #fff7de; text-wrap: balance;}
.qp-content {padding-block: clamp(2px, .65vw, 10px); display: flex; flex-direction: column; align-items: stretch; gap: clamp(11px, 1.2vw, 19px); min-width: 0;}
.qp-stage .qp-setup {font-size: clamp(17px, 1.6vw, 26px); line-height: 1.33; color: #e1e8ec; text-wrap: pretty;}
.qp-stage .qp-heading {font-size: clamp(29px, 2.65vw, 48px); line-height: 1.09; color: #fff8df; font-weight: 700; text-wrap: pretty; overflow-wrap: break-word;}
.qp-heading:focus {outline: none;}
.qp-instruction {display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--qp-tint); font-size: clamp(16px, 1.34vw, 22px); line-height: 1.17;}
.qp-count {white-space: nowrap; font-size: .9em; color: #e1e8ec; font-variant-numeric: tabular-nums;}
.qp-cards {display: grid; gap: 8px;}
.qp-card {
  position: relative; width: 100%; min-height: 48px; display: grid; align-items: center;
  grid-template-columns: 2.2em 1fr 1.2em; column-gap: .65em; padding: .32em .68em .32em .35em;
  border: 2px solid #7d92a0; border-radius: 14px 19px 16px 14px;
  color: #f9f5e9; background: linear-gradient(110deg, #304154, #26364b);
  font-size: clamp(16px, 1.4vw, 23px)!important; line-height: 1.19!important;
  text-align: left; transition: background .15s, transform .15s, border-color .15s;
}
.qp-card:hover:enabled {border-color: var(--qp-tint); transform: translateX(2px);}
.qp-card.qp-picked {background: #384a4f; border-color: var(--qp-tint); box-shadow: inset 3px 0 var(--qp-tint);}
.qp-card:disabled {opacity: .62;}
.qp-card .qp-pictogram {
  display: grid; place-items: center; width: 1.68em; height: 1.57em; font-size: 1.27em;
  background: #fff1c9; border-radius: 51% 47% 48% 43%;
  color: #273744; line-height: 1; font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
.qp-card:nth-child(2) .qp-pictogram {background: #cee6e0; border-radius: 44% 52% 45% 53%;}
.qp-card:nth-child(3) .qp-pictogram {background: #f2d4cf; border-radius: 55% 45% 51% 45%;}
.qp-card-label {min-width: 0;}
.qp-mark {justify-self: center; display: grid; place-items: center; min-width: 1.28em; height: 1.28em; color: #d9e6ee;}
.qp-detect .qp-mark, .qp-direct .qp-mark {border: 1.5px solid #89a0ac; border-radius: 50%; width: 1.22em; min-width: auto; height: 1.22em;}
.qp-picked .qp-mark {color: var(--qp-ink); background: var(--qp-tint); border-color: var(--qp-tint); font-weight: 700;}
.qp-mark svg {width: 90%; height: 90%;}
.qp-actions {display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;}
.qp-actions:empty {display: none;}
.qp-button {
  appearance: none; border: 1.5px solid transparent; display: inline-flex; align-items: center; justify-content: center;
  gap: .45em; padding: .52em .8em; min-height: 39px; border-radius: 13px 16px 13px 15px;
  font-size: clamp(15px, 1.25vw, 20px)!important; line-height: 1.15!important; text-align: center;
}
.qp-primary {background: var(--qp-warm); color: #192d36; font-weight: 700!important; box-shadow: 0 3px #080e1a77;}
.qp-primary:enabled:hover {background: #fff1be;}
.qp-primary:disabled {color: #c4d0d8; background: #425064; box-shadow: none;}
.qp-subtle, .qp-home-link {background: transparent; color: #edf2ec; border-color: #6c7d8e;}
.qp-subtle:hover:enabled, .qp-home-link:hover {background: #344557;}
.qp-subtle:disabled {opacity: .45;}
.qp-home-link {padding: .38em .7em; min-height: 36px;}
.qp-resources {display: flex; align-items: flex-start; flex-wrap: wrap; column-gap: 20px; row-gap: 3px;}
.qp-disclosure {font-size: clamp(15px, 1.17vw, 20px); min-width: 0; color: var(--qp-muted);}
.qp-disclosure summary {list-style: none; display: inline-flex; gap: 6px; align-items: center; color: #dbe5ea; min-height: 34px;}
.qp-disclosure summary::-webkit-details-marker {display: none;}
.qp-disclosure summary:hover {color: var(--qp-tint);}
.qp-disclosure summary::after {content: '▾'; color: var(--qp-tint); font-size: .8em;}
.qp-disclosure[open] {flex: 1 0 100%;}
.qp-disclosure[open] summary::after {transform: rotate(180deg);}
.qp-disclosure p {margin-top: 2px; border-left: 2px solid var(--qp-rim); padding: .28em .75em; line-height: 1.38;}
.qp-stage .qp-review-picks {display: grid; gap: 6px;}
.qp-review-pick {display: flex; align-items: baseline; gap: 10px; font-size: clamp(15px, 1.3vw, 22px); line-height: 1.25; color: #dce5ea;}
.qp-review-pick b {color: var(--qp-tint);}
.qp-outcome {padding: .9em 1.08em; background: #26394a; border-left: 4px solid var(--qp-tint); border-radius: 0 16px 16px 0;}
.qp-outcome h4, .qp-transfer h4 {font-size: clamp(18px, 1.5vw, 26px); line-height: 1.22; color: var(--qp-tint);}
.qp-outcome p, .qp-transfer p, .qp-stage .qp-discussion {font-size: clamp(17px, 1.55vw, 26px); line-height: 1.36; margin-top: .3em;}
.qp-discussion {color: #d5e4e7;}
.qp-finished .qp-content {align-self: center;}
.qp-victory-mark {display: flex; align-items: center; gap: .5em; color: var(--qp-tint); font-size: clamp(18px, 1.6vw, 26px);}
.qp-victory-mark svg {padding: 3px; width: 1.6em; height: 1.6em; border: 2px solid; border-radius: 50%;}
.qp-finished .qp-heading {font-size: clamp(38px, 4.6vw, 78px);}
.qp-stage .qp-rule {color: #ffdf98; display: flex; align-items: center; gap: .5em; font-size: clamp(19px, 1.8vw, 31px);}
.qp-transfer {margin-block: .4em; padding-top: 1.1em; border-top: 1px solid #546575;}
@container (max-width: 800px) {
  .qp-main {gap: 22px; grid-template-columns: minmax(0,.86fr) minmax(0,1.14fr);}
  .qp-setup {font-size: 17px;}
  .qp-actions {gap: 7px;}
}
@container (max-width: 630px) {
  .qp-main {display: flex; flex-direction: column; align-items: stretch; gap: 16px;}
  .qp-image {position: relative; top: auto;}
  .qp-scene-art {border-radius: 10px; max-height: none;}
  .qp-caption {padding: 9px 0 0; gap: 12px; flex-direction: row; align-items: baseline; flex-wrap: wrap;}
  .qp-stage .qp-place {font-size: clamp(24px, 5.7vw, 34px);}
  .qp-stage .qp-heading {font-size: clamp(25px, 6vw, 34px);}
  .qp-content {gap: 12px; padding: 0;}
  .qp-top {padding-bottom: 14px;}
  .qp-format-tag {gap: 6px;}
  .qp-format-tag svg {width: 21px; height: 21px;}
  .qp-home-link {font-size: 14px!important;}
  .qp-finished .qp-content {align-self: stretch;}
}
@media (prefers-reduced-motion: reduce) {
  .qp-stage *, .qp-stage *::before, .qp-stage *::after {scroll-behavior: auto; animation-duration: .01ms!important; transition-duration: .01ms!important;}
  .qp-card:hover:enabled {transform: none;}
}

<script>
(() => {
  'use strict';

  const themes = {

      inventory: 'Находки в пути', play: 'Открыть загадку',

    glade: {

  };

  function node(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function hiddenMark(className, text) {
    const el = node('span', className, text);
    el.setAttribute('aria-hidden', 'true');
    return el;
  }

  function action(className, label, handler) {
    const button = node('button', className);
    button.type = 'button';
    button.setAttribute('aria-label', label);
    button.addEventListener('click', handler);
    return button;
  }

  const stars = [

    [[2,12],[7,5],[14,12],[21,4],[28,10]], [[1,15],[10,7],[18,11],[27,1]],

    line.setAttribute('points', points.map(pair => pair.join(',')).join(' '));

    for (const [i,point] of points.entries()) {
      const star = document.createElementNS(svg.namespaceURI,'circle');
      star.setAttribute('cx',point[0]); star.setAttribute('cy',point[1]);
      star.setAttribute('r',i === 1 ? '2.4' : '1.6');
      svg.append(star);
    }
    return svg;
  }

  function ruleSection(theme, onRule) {
    const section = node('section','home-rules');
    const settings = themes[theme];
    section.setAttribute('aria-label',settings.ruleHeading);
    section.append(node('h3','home-section-title',settings.ruleHeading));
    const list = node('ul','home-rule-list');
    for (const [i, text] of window.RULES.entries()) {
      const li = node('li');
      const button = action('home-rule', text, () => onRule(i));
      button.dataset.rule = i;
      if (theme === 'pass') button.append(constellation(i));
      if (theme === 'glade') button.append(hiddenMark('home-rule-emblem', ['🐾', '👂', '♥', '⚽', '🔔'][i]));
      if (theme === 'theater') button.append(hiddenMark('home-rule-cut','✦'));
      button.append(node('span','home-rule-name',text));
      li.append(button); list.append(li);
    }
    section.append(list);
    return section;
  }

  function gearSection(theme,owned,onObject) {
    const section = node('section','home-gear');
    const title = node('h3','home-section-title',themes[theme].inventory);
    title.append(node('span','home-count',`${owned} из ${window.ITEMS.length}`));
    section.append(title);
    const list = node('ul','home-gear-list');
    for (const [i,name] of window.ITEMS.entries()) {
      const found = i < owned;
      const state = found ? 'в рюкзаке' : 'ещё предстоит найти';
      const li = node('li');
      const button = action(`home-gear-button ${found ? 'home-found' : 'home-unfound'}`,`${name}, ${state}`,() => onObject(i));
      button.title = `${name} · ${state}`;
      button.dataset.item = i;
      const holder = node('span','home-gear-holder');
      const image = node('img','home-gear-art');
      image.src = window.ASSETS[`gear${i}`]; image.alt = ''; image.draggable = false;
      holder.append(image,hiddenMark('home-item-status', found ? '✓' : '?'));
      button.append(holder,node('span','home-item-name',name));
      li.append(button); list.append(li);
    }
    section.append(list);
    return section;
  }

  function nextEpisode(theme,stop,onPlay) {
    const box = node('section','home-episode');
    box.setAttribute('aria-label','Текущая остановка');
    box.append(node('p','home-place',stop.place));
    const button = action('home-play', `${themes[theme].play} · ${stop.place}`, onPlay);
    button.dataset.action = 'play';
    const mark = hiddenMark('home-play-mark','▶');
    button.append(mark,node('span','home-play-label',themes[theme].play));
    box.append(button);
    return box;
  }

  window.renderHome = function renderHome({theme,stop,owned,onPlay,onObject,onRule}) {
    const settings = themes[theme];
    const stage = node('section',`home-stage home-${theme}`);
    stage.setAttribute('aria-label',settings.title.join(' '));
    const world = node('div','home-world');
    const bg = node('img','home-art'); bg.src = window.ASSETS[theme]; bg.alt = ''; bg.draggable = false;
    world.append(bg,node('div','home-shade'));
    if (theme === 'glade') {
      const fox = node('img', 'home-fox');
      fox.src = window.ASSETS.iskorka;
      fox.alt = 'Искорка с картой в рюкзаке';
      fox.draggable = false;
      world.append(fox);
    }
    const title = node('h2','home-title');
    for (const word of settings.title) title.append(node('span','home-title-line',word));
    const status = node('p','home-status');
    if (Number(stop.step) === 50) status.append(node('span','home-day','День 13'));
    status.append(node('span','home-step',`${stop.step} из 100 шагов`));
    world.append(title,status,ruleSection(theme,onRule),gearSection(theme,owned,onObject),nextEpisode(theme,stop,onPlay));
    stage.append(world);
    return stage;
  };
})();

</script>
<script>
(() => {
  'use strict';

  const formats = {
    detect: {name: 'Найди подсказки', symbol: 'glass', instruction: 'Нажми на две подсказки'},
    fork: {name: 'Выбери ход', symbol: 'fork', instruction: 'Нажми на один вариант'},
    direct: {name: 'Собери историю', symbol: 'film', instruction: 'Нажми на картинки по порядку'}
  };

  const drawings = {
    glass: '<circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5M7 10a3 3 0 0 1 3-3"/>',
    fork: '<path d="M12 21v-4c0-4-6-5-6-10V3m-3 3 3-3 3 3m3 11c0-4 6-5 6-10V3m-3 3 3-3 3 3"/>',
    film: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M6 4v16m12-16v16M3 9h3m-3 6h3m12-6h3m-3 6h3m-11-4 4 2-4 2Z"/>',
    light: '<path d="M8 15c0-2-2.5-3-2.5-6a6.5 6.5 0 1 1 13 0c0 3-2.5 4-2.5 6m-8 0h8m-7 3h6m-5 3h4"/>',
    talk: '<path d="M20.5 13a3 3 0 0 1-3 3H12l-5 4v-4H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h11.5a3 3 0 0 1 3 3z"/><path d="M7.5 9.5h.01m4-.01h.01m4-.01h.01" stroke-width="3"/>',
    home: '<path d="m2.5 11 9.5-8 9.5 8m-16-1v10h5v-6h3v6h5V10"/>',
    arrow: '<path d="M4 12h15m-5-6 6 6-6 6"/>',
    replay: '<path d="M4 10a8 8 0 1 1 0 5m0-11v6h6"/>',
    check: '<path d="m4 12 5 5L20 6"/>',
    trail: '<ellipse cx="8" cy="16" rx="2.6" ry="4.3" transform="rotate(-22 8 16)"/><ellipse cx="16" cy="8" rx="2.6" ry="4.3" transform="rotate(22 16 8)"/>',
    star: '<path d="m12 2 2.9 6.3 6.8 1-5 4.9 1.2 6.8-5.9-3.3L6.1 21l1.2-6.8-5-4.9 6.8-1z"/>'
  };

  const create = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  function symbol(name) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.7');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.innerHTML = drawings[name];
    return svg;
  }

  function action(key, label, click, variant = 'subtle', glyph) {
    const node = create('button', 'qp-button qp-' + variant);
    node.type = 'button';
    node.dataset.action = key;
    if (glyph) node.append(symbol(glyph));
    node.append(create('span', '', label));
    node.addEventListener('click', click);
    return node;
  }

  function detail(label, text, glyph) {
    const block = create('details', 'qp-disclosure');
    const summary = create('summary');
    summary.append(symbol(glyph), create('span', '', label));
    block.append(summary, create('p', '', text));
    return block;
  }

  function renderPlayer({stop, format, art, onWin, onHome, onNext, onReplay}) {
    const spec = formats[format];
    const model = stop[format];
    const last = Number(stop.step) === 100;
    const stage = create('article', 'qp-stage qp-' + format);
    stage.dataset.format = format;
    stage.dataset.stop = stop.id;
    const picks = [];
    let phase = 'play';
    let winSent = false;

    const top = create('div', 'qp-top');
    const formatMark = create('span', 'qp-format-tag');
    formatMark.append(symbol(spec.symbol), create('span', '', spec.name));
    top.append(formatMark, action('home', 'К Искорке', onHome, 'home-link', 'home'));

    const main = create('div', 'qp-main');
    const picture = create('figure', 'qp-image');
    const sceneImage = create('img', 'qp-scene-art');
    sceneImage.src = art.before;
    sceneImage.alt = art.altBefore || ('Иллюстрация остановки «' + stop.place + '»');
    const cap = create('figcaption', 'qp-caption');
    const stepLabel = create('span', 'qp-waypoint');
    stepLabel.append(symbol('trail'), create('span', '', 'Шаг ' + stop.step));
    const place = create('h2', 'qp-place', stop.place);
    cap.append(stepLabel, place);
    picture.append(sceneImage, cap);
    const listening = stop.id === 'compass' && format === 'detect' ? window.renderListeningExperiment?.() : null;
    if (listening) picture.append(listening);
    const body = create('div', 'qp-content');
    body.setAttribute('aria-label', 'Загадка класса');
    main.append(picture, body);
    stage.append(top, main);

    const card = (entry, index, handler) => {
      const button = create('button', 'qp-card');
      button.type = 'button';
      button.dataset.choice = String(index);
      if (format !== 'fork') button.setAttribute('aria-pressed', 'false');
      const graphic = create('span', 'qp-pictogram', entry.icon);
      graphic.setAttribute('aria-hidden', 'true');
      const label = create('span', 'qp-card-label', entry.label);
      const badge = create('span', 'qp-mark');
      badge.setAttribute('aria-hidden', 'true');
      if (format === 'fork') badge.append(symbol('arrow'));
      button.append(graphic, label, badge);
      button.addEventListener('click', handler);
      return button;
    };

    function focusHeading() {
      const heading = body.querySelector('h3');
      if (!heading || !stage.isConnected) return;
      heading.focus({preventScroll: true});
      if (heading.getBoundingClientRect().top < 0) heading.scrollIntoView({block: 'nearest'});
    }

    function heading(text) {
      const node = create('h3', 'qp-heading', text);
      node.tabIndex = -1;
      return node;
    }

    function finish() {
      if (phase === 'end') return;
      phase = 'end';
      stage.dataset.phase = phase;
      stage.classList.add('qp-finished');
      if (listening) listening.remove();
      sceneImage.src = art.after || art.before;
      sceneImage.alt = 'Иллюстрация завершённой остановки «' + stop.place + '»';
      const payoff = stop.payoff || (last ? 'Маяк зажёгся!' : stop.item);
      const victoryMark = create('div', 'qp-victory-mark');
      const awardLabel = last ? 'Путь пройден' : stop.item ? 'В рюкзаке Искорки' : 'Помогли Искорке';
      victoryMark.append(symbol(last ? 'star' : 'check'), create('span', '', awardLabel));
      const rule = create('p', 'qp-rule');
      rule.append(symbol('star'), create('span', '', stop.rule));
      const transfer = create('section', 'qp-transfer');
      transfer.append(create('h4', '', 'А как у нас в классе?'), create('p', '', stop.transfer));
      const controls = create('div', 'qp-actions');
      controls.append(action('next', last ? 'К Искорке' : 'Идём дальше', onNext, 'primary', 'arrow'),
        action('replay', 'Ещё раз', onReplay, 'subtle', 'replay'));
      body.replaceChildren(victoryMark, heading(payoff), rule, transfer, controls);
      if (!winSent) {
        winSent = true;
        onWin();
      }
      focusHeading();
    }

    function feedback(title, text) {
      const result = create('section', 'qp-outcome');
      result.append(create('h4', '', title), create('p', '', text));
      return result;
    }

    function examine(showAnswer = false) {
      phase = 'review';
      stage.dataset.phase = phase;
      const chosen = picks.map(i => (format === 'detect' ? model.clues : format === 'direct' ? model.beats : model.plans)[i].label);
      const isCanonical = format === 'direct' ? picks.every((v, i) => v === i) : format === 'detect' && model.key.every(i => picks.includes(i));
      let title = format === 'fork' ? chosen[0] : format === 'detect' ? 'Наши подсказки' : 'Наша история';
      if (showAnswer === true) title = format === 'direct' ? 'История Искорки' : 'Подсказки Искорки';
      const list = create('div', 'qp-review-picks');
      if (format !== 'fork') chosen.forEach((x, i) => {
        const node = create('span', 'qp-review-pick');
        const marker = create('b', '', format === 'direct' ? String(i + 1) : '•');
        node.append(marker, create('span', '', x));
        list.append(node);
      });
      body.replaceChildren(heading(title));
      if (list.children.length) body.append(list);
      if (format === 'fork') {
        body.append(feedback('Вот что вышло', model.plans[picks[0]].result),
          create('p', 'qp-discussion', model.talk));
      } else if (isCanonical) {
        body.append(feedback(format === 'detect' ? 'Как сделала Искорка' : 'Вот что вышло', model.why));
      } else {
        const prompt = format === 'detect'
          ? model.missingHints[model.key.find(i => !picks.includes(i))]
          : model.orderHints[picks.indexOf(0) > picks.indexOf(1) ? 0 : 1];
        body.append(feedback('Давай подумаем ещё', prompt));
      }
      const buttons = create('div', 'qp-actions');
      const needsHelp = format !== 'fork' && !isCanonical;
      if (!needsHelp) {
        buttons.append(action('finish', last && format !== 'direct' ? 'Зажечь Маяк' : 'Смотрим дальше', finish, 'primary', 'arrow'));
      }
      if (format === 'fork') {
        const other = 1 - picks[0];
        buttons.append(action('other', 'Попробовать другой ход', () => {
          picks[0] = other;
          examine();
        }, 'subtle', 'fork'));
      } else {
        buttons.append(action('retry', format === 'detect' ? 'Выбрать другие подсказки' : 'Переставить кадры', () => {
          picks.length = 0;
          phase = 'play';
          play();
          focusHeading();
        }, needsHelp ? 'primary' : 'subtle', 'replay'));
        if (needsHelp) {
          buttons.append(action('show-solution', 'Как сделала Искорка?', () => {
            const answer = format === 'direct' ? [0, 1, 2] : model.key;
            picks.splice(0, picks.length, ...answer);
            examine(true);
          }, 'subtle', 'light'));
        }
      }
      body.append(buttons);
      focusHeading();
    }

    function talkText() {
      if (format === 'detect') return 'Покажи одну подсказку. Пусть сосед найдёт вторую. Вместе скажите, что они подсказали.';
      if (format === 'direct') return 'Обсуди с соседом, что было сначала. Потом покажите свой порядок.';
      return 'Скажи соседу, как бы ты поступил. Попробуйте оба хода и сравните, что вышло.';
    }

    function play() {
      stage.dataset.phase = phase;
      const setup = create('p', 'qp-setup', model.setup);
      const ask = heading(model.ask);
      const task = create('div', 'qp-instruction');
      const count = create('span', 'qp-count');
      count.setAttribute('role', 'status');
      task.append(create('strong', '', spec.instruction), count);
      const choices = create('div', 'qp-cards');
      choices.setAttribute('role', 'group');
      choices.setAttribute('aria-label', spec.instruction);
      const controls = create('div', 'qp-actions');
      const resources = create('div', 'qp-resources');
      if (format !== 'fork') resources.append(detail('Нужна помощь?', model.hint, 'light'));
      resources.append(detail('Обсудим с другом', talkText(), 'talk'));
      body.replaceChildren(setup, ask, task, choices, controls, resources);
      const entries = format === 'detect' ? model.clues : format === 'direct' ? model.beats : model.plans;
      const orders = [[2,0,1], [1,2,0], [1,0,2], [2,1,0]];
      const order = format === 'fork' ? [0,1] : orders[Number(stop.step) % orders.length];
      const buttons = new Map();
      const amount = format === 'detect' ? 2 : 3;
      const primary = action('review', format === 'detect' ? 'Проверить подсказки' : 'Показать историю', examine, 'primary', 'arrow');
      const undo = action('undo', 'Убрать последнюю картинку', () => {
        picks.pop();
        update();
      }, 'subtle', 'replay');
      if (format !== 'fork') controls.append(primary);
      if (format === 'direct') controls.append(undo);
      order.forEach(i => {
        const button = card(entries[i], i, () => {
          if (format === 'fork') {
            picks[0] = i;
            examine();
            return;
          }
          const position = picks.indexOf(i);
          if (position >= 0) picks.splice(position, 1);
          else if (picks.length < amount) picks.push(i);
          update();
        });
        buttons.set(i, button);
        choices.append(button);
      });
      function update() {
        if (format === 'fork') return;
        count.textContent = picks.length + ' из ' + amount;
        primary.disabled = picks.length < amount;
        undo.disabled = picks.length === 0;
        for (const [index, node] of buttons) {
          const at = picks.indexOf(index);
          const selected = at >= 0;
          node.classList.toggle('qp-picked', selected);
          node.setAttribute('aria-pressed', String(selected));
          node.disabled = !selected && picks.length === amount;
          node.setAttribute('aria-label', entries[index].label + (selected && format === 'direct' ? '. Кадр ' + (at + 1) : ''));
          const mark = node.querySelector('.qp-mark');
          mark.replaceChildren();
          if (selected && format === 'direct') mark.textContent = String(at + 1);
          if (selected && format === 'detect') mark.append(symbol('check'));
        }
      }
      update();
    }

    play();
    return stage;
  }

  window.renderPlayer = renderPlayer;
})();

</script>
<script>
(() => {
  'use strict';
  window.renderListeningExperiment = function () {
    const section = document.createElement('section');
    section.className = 'listening'; section.setAttribute('aria-label','Послушать лес');
    const title = document.createElement('strong'); title.textContent = 'Послушаем лес';
    const controls = document.createElement('div');
    const status = document.createElement('span'); status.className = 'sound-status'; status.setAttribute('role','status');
    const player = document.createElement('audio');
    let active = '';
    function silence() {player.pause(); active=''; for(const b of controls.children) b.setAttribute('aria-pressed','false'); status.textContent='';}
    player.addEventListener('ended',silence);
    for (const [key,label] of [['walk','Искорка шагает'],['still','Искорка стоит']]) {
      const button = document.createElement('button'); button.type='button'; button.textContent='▶  '+label; button.dataset.sound=key; button.setAttribute('aria-pressed','false');
      button.onclick = async () => {
        if(active===key){silence();return;}
        silence(); active=key; player.src=window.ASSETS[key]; button.setAttribute('aria-pressed','true'); status.textContent='Слушаем…';
        try {await player.play();} catch {if(active===key){silence();status.textContent='Нажми «Что слышно?» ниже.';}}
      };
      controls.append(button);
    }
    const alt = document.createElement('details'); const summary = document.createElement('summary'); summary.textContent='Что слышно?';
    const words=document.createElement('p'); words.textContent='Пока Искорка идёт, слышны два звона. Один звякает рядом, другой справа. Искорка встала. Теперь звенит только справа.';
    alt.append(summary,words);section.append(title,controls,status,alt,player);
    const observer=new MutationObserver(()=>{if(!section.isConnected){silence();observer.disconnect();}});
    observer.observe(document.getElementById('stage'),{childList:true,subtree:true});
    return section;
  };
})();

</script>
<script>
(() => {
  'use strict';
  const pack=JSON.parse(document.getElementById('payload').textContent);
  const {stops,captions,scenes}=pack;
  const gearStops = stops.filter(s => s.item && s.id !== 'lighthouse');
  window.RULES=pack.rules; window.ASSETS=pack.assets; window.ITEMS=gearStops.map(s=>s.item);
  const themes={pass:'Перевал',glade:'Лесная поляна',theater:'Театр'};
  const formats={detect:'Найди подсказки',fork:'Выбери ход',direct:'Собери историю'};
  const symbols={detect:'⌕',fork:'⑂',direct:'▤'};
  const ruleIcons=['🐾','👂','♥','⚽','🔔'];
  const ruleHashPattern=/^#rules(?:\/(glade|pass|theater)\/([0-4]))?$/;
  const initialRules=location.hash.match(ruleHashPattern);
  function routeFromHash(hash) {
    const [page,themeKey,stopKey,formatKey]=hash.slice(1).split('/');
    return {
      theme:Object.hasOwn(themes,themeKey)?themeKey:'glade',
      idx:Math.max(0,stops.findIndex(s=>s.id===stopKey)),
      format:Object.hasOwn(formats,formatKey)?formatKey:'detect',
      view:page==='play'?'play':'home'
    };
  }
  const initialGame=initialRules ? (history.state?.ruleParent || '#home/'+(initialRules[1]||'glade')) : location.hash;
  let {theme,idx,format,view}=routeFromHash(initialGame);
  let rulesVisible=false;
  let won=false,clean=false;
  const $=id=>document.getElementById(id),stage=$('stage'),dialog=$('overlay'),sheet=$('sheet');
  const node=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!=null)el.textContent=text;return el;};
  const btn=(cls,text,fn)=>{const el=node('button',cls,text);el.type='button';el.onclick=fn;return el;};
  function close(){
    rulesVisible=false;
    if(dialog.open)dialog.close();
  }
  function dismiss(){
    if(rulesVisible && history.state?.ruleParent){
      history.back();
      return;
    }
    close();
    pushHash();
  }
  dialog.addEventListener('cancel',ev=>{if(rulesVisible){ev.preventDefault();dismiss();}});
  function owned(){
    const current=stops[idx];
    return gearStops.filter(s=>s.step<current.step || (won && s.id===current.id)).length;
  }
  function gameHash(){return '#'+[view,theme,stops[idx].id,format].join('/');}
  function pushHash(){if(location.hash!==gameHash())history.replaceState(null,'',gameHash());}
  function shellModal(title,small=false){
    sheet.replaceChildren();dialog.classList.remove('rules-book','rule-detail');dialog.classList.toggle('small',small);
    const head=node('div','sheet-head');const h=node('h2','',title);h.id='overlay-title';
    const x=btn('sheet-close','×',dismiss);x.setAttribute('aria-label','Закрыть');head.append(h,x);sheet.append(head);
    if(!dialog.open)dialog.showModal();dialog.scrollTop=0;
  }
  dialog.addEventListener('click',ev=>{if(ev.target===dialog){const b=dialog.getBoundingClientRect();if(ev.clientY<b.top||ev.clientY>b.bottom||ev.clientX<b.left||ev.clientX>b.right)close();}});
  function start(i,k){
    close();if(i!==idx)won=false;idx=i;format=k;view='play';render(true);
  }
  function home(){close();view='home';render(true);}
  function openItem(i){
    const s=gearStops[i],found=i<owned();
    shellModal(s.item,true);
    const pic=node('img','detail-item'+(found?'':' detail-future'));pic.alt='';pic.src=window.ASSETS['gear'+i];
    const body=node('p','detail-text',found?'Уже в рюкзаке. '+pack.itemCopy[s.id]:'Искорка ещё ищет этот предмет. '+s.place+'.');
    const go=btn('launch','Решить загадку',()=>start(stops.indexOf(s),format));sheet.append(pic,body,go);
  }
  function ruleIcon(i){
    const icon=node('span','rule-emblem',ruleIcons[i]);
    icon.setAttribute('aria-hidden','true');
    icon.dataset.ink=String(i);
    return icon;
  }
  function markRulePage(hash){
    if(location.hash!==hash){
      if(ruleHashPattern.test(location.hash)) history.replaceState(history.state,'',hash);
      else history.pushState({ruleParent:gameHash()},'',hash);
    }
    rulesVisible=true;
  }
  function focusRuleTitle(){
    const title=$('overlay-title');
    title.tabIndex=-1;
    title.focus({preventScroll:true});
    dialog.scrollTop=0;
  }
  function openRule(i){
    const rule=pack.ruleGuide[i];
    markRulePage('#rules/'+theme+'/'+i);
    shellModal(rule.label,true);
    dialog.classList.add('rule-detail');
    $('overlay-title').prepend(ruleIcon(i));
    const example=node('section','rule-example');
    example.append(node('h3','','Пример из школы'),node('p','',rule.example));
    const actions=node('div','rule-actions');
    const first=stops.findIndex(s=>s.rule===rule.label);
    const quest=btn('rule-related','Решить загадку',()=>start(first,format));
    quest.dataset.ruleQuest='';
    actions.append(btn('launch','Все правила',openRules),quest);
    sheet.append(node('p','rule-meaning',rule.meaning),example,actions);
    focusRuleTitle();
  }
  function openRules(){
    markRulePage('#rules');
    shellModal('Правила класса');
    dialog.classList.add('rules-book');
    const layout=node('div','rule-layout');
    const list=node('ul','rule-list');
    for(const [i,rule] of pack.ruleGuide.entries()){
      const li=node('li','');
      const button=btn('rule-entry','',()=>openRule(i));
      button.dataset.openRule=String(i);
      const copy=node('span','rule-copy');
      copy.append(node('strong','',rule.label),node('span','',rule.meaning));
      const chevron=node('span','rule-more','›');chevron.setAttribute('aria-hidden','true');
      button.append(ruleIcon(i),copy,chevron);
      li.append(button);list.append(li);
    }
    const day=node('section','rule-day');
    day.append(node('h3','','Звёздочки за день'),node('p','',pack.starGuide.meaning));
    const sample=node('div','rule-day-example');
    const stars=node('span','rule-stars','★★★★');
    stars.append(node('span','','☆'));stars.setAttribute('aria-hidden','true');
    sample.append(node('h4','','Например, четыре звёздочки'),stars,node('p','',pack.starGuide.example));
    day.append(sample);
    layout.append(list,day);sheet.append(layout);
    focusRuleTitle();
  }
  function openCatalogue(selected=idx){
    shellModal('Остановки и загадки');
    sheet.append(node('p','sheet-intro','Выбери место на пути и загадку.'));
    const grid=node('div','selector-grid'), list=node('div','stop-picker'), box=node('div','selected-stop');
    list.setAttribute('role','group');list.setAttribute('aria-label','Остановки на пути');
    function select(i){
      selected=i; const s=stops[i];
      for(const [n,el] of [...list.children].entries())el.setAttribute('aria-pressed',String(n===i));
      const pic=node('img','preview-place');pic.src=scenes[s.id].detect;pic.alt='';
      const h=node('h3','',[s.place,s.item].filter(Boolean).join(' · '));
      box.replaceChildren(pic,h,node('p','',s.scene));
      for(const [n,[key,name]] of Object.entries(formats).entries()){
        const b=btn('format-entry','',()=>start(i,key));
        b.dataset.format=key;b.dataset.stop=s.id;
        const copy=node('span','');copy.append(node('strong','',name),node('small','',captions[s.id][n]));
        const mark=node('span','format-symbol',symbols[key]);mark.setAttribute('aria-hidden','true');
        b.append(mark,copy,node('span','format-chevron','›'));box.append(b);
      }
      box.append(btn('selector-next','Посмотреть, где Искорка',()=>{idx=i;won=false;home();}));
    }
    for(const [i,s] of stops.entries()){
      const b=btn('','',()=>select(i));b.dataset.stop=s.id;
      const text=node('span','',s.place);text.append(node('small','',s.item || 'Первая загадка'));
      b.append(node('b','',s.step),text);list.append(b);
    }
    grid.append(list,box);sheet.append(grid);select(selected);
  }
  function openCompare(){
    shellModal('Было / стало');
    sheet.append(node('p','sheet-intro','Выберите загадку справа, чтобы сыграть. Слева можно прочитать прежний вопрос на этой остановке.'));
    const table=node('table','comp-table'),thead=table.createTHead(),head=thead.insertRow();
    for(const t of ['Остановка и прежний вопрос','Три игровых варианта']){const th=node('th','',t);th.scope='col';head.append(th);}
    const tbody=table.createTBody();
    for(const [i,s] of stops.entries()){
      const row=tbody.insertRow(),left=node('th','');left.scope='row';left.append(node('strong','',s.step+' · '+s.place),node('small','',s.before ? s.item+' · «'+s.before+'»' : 'Новая остановка. Раньше первая загадка была на шаге 15.'));row.append(left);
      const right=row.insertCell();
      for (const [n,[key,name]] of Object.entries(formats).entries()){
        const link=btn('comparison-link','',()=>start(i,key));link.dataset.stop=s.id;link.dataset.format=key;
        link.append(node('b','',name+'  ›  '),document.createTextNode(captions[s.id][n]));right.append(link);
      }
    }
    sheet.append(table);
  }
  const tab=$('theme-list');
  for(const [key,title] of Object.entries(themes)){
    const b=btn('theme',title,()=>{theme=key;home();});b.dataset.theme=key;tab.append(b);
  }
  function render(focus=false,keepHash=false){
    if(!keepHash)pushHash(); const s=stops[idx];
    for(const b of tab.children)b.setAttribute('aria-pressed',String(theme===b.dataset.theme));
    if(view==='home'){
      stage.replaceChildren(window.renderHome({theme,stop:s,owned:owned(),onPlay:()=>start(idx,format),onObject:openItem,onRule:openRule}));
    }else{
      const player=window.renderPlayer({stop:s,format,art:{before:scenes[s.id][format],after:scenes[s.id].after,altBefore:pack.pictureNotes[s.id][Object.keys(formats).indexOf(format)]},
        onWin:()=>{won=true;},onHome:home,onNext:()=>{if(idx===stops.length-1){home();return;}idx++;won=false;home();},onReplay:()=>start(idx,format)});
      const tools=node('nav','player-tools');tools.setAttribute('aria-label','Сравнить способы игры');
      tools.append(node('span','','На этой остановке'));
      for(const [key,title] of Object.entries(formats)){
        const b=btn('',title,()=>start(idx,key));b.dataset.switchFormat=key;b.setAttribute('aria-pressed',String(key===format));tools.append(b);
      }
      tools.hidden=clean;stage.replaceChildren(tools,player);
    }
    if(focus){window.scrollTo({top:0,behavior:'instant'});stage.focus({preventScroll:true});}
  }
  function cleanMode(enabled){
    clean=enabled;document.body.classList.toggle('during-show',enabled);$('studio').hidden=enabled;$('present-exit').hidden=!enabled;
    const tools=stage.querySelector('.player-tools');if(tools)tools.hidden=enabled;
    window.scrollTo(0,0);
  }
  $('present').onclick=async ()=>{cleanMode(true);try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch{/* Good embedded viewers can still hide the studio controls. */}};
  $('present-exit').onclick=()=>{cleanMode(false);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});$('present').focus();};
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&clean)cleanMode(false);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&clean&&!dialog.open)cleanMode(false);});
  $('catalog-open').onclick=()=>openCatalogue();$('compare-open').onclick=openCompare;
  $('rules-open').onclick=openRules;
  function showRuleHash(match) {
    if(match[2]!==undefined) openRule(Number(match[2]));
    else openRules();
  }
  window.addEventListener('hashchange',()=>{
    const requestedRules=location.hash.match(ruleHashPattern);
    if(requestedRules){showRuleHash(requestedRules);return;}
    if(rulesVisible && location.hash===gameHash()){close();return;}
    const route=routeFromHash(location.hash);
    if(idx!==route.idx)won=false;
    ({theme,idx,format,view}=route);
    close();render(true);
  });
  render(false,Boolean(initialRules));
  if(initialRules)showRuleHash(initialRules);
})();

</script>
</body>
</html>
